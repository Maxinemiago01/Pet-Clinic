name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: android-${{ github.run_number }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Create and sync the Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'

      - name: Build the installable APK
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon

      - name: Prepare the APK and download QR
        run: |
          npm run android:qr
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/petcare.apk
          cd downloads
          sha256sum petcare.apk > petcare.apk.sha256

      - name: Save the APK and QR as build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: petcare-android-${{ github.run_number }}-${{ github.run_attempt }}
          path: downloads/
          if-no-files-found: error
          compression-level: 0

      - name: Publish the Android download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            downloads/petcare.apk \
            downloads/petcare-download-qr.png \
            downloads/download-url.txt \
            downloads/petcare.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Petcare Android build $GITHUB_RUN_NUMBER" \
            --notes-file downloads/release-notes.md \
            --latest

      - name: Show the download QR in the run summary
        run: cat downloads/release-notes.md >> "$GITHUB_STEP_SUMMARY"
