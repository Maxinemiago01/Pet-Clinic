<ion-content #content>
  <div class="app-layout">
    <div class="workspace">
      <header class="topbar">
        <a class="brand mobile-brand" routerLink="/app"
          ><img src="assets/paw.png" alt="" /><span>petcare.</span></a
        >
        <div class="topbar-right">
          <span class="account-avatar">{{ auth.email.charAt(0).toUpperCase() }}</span
          ><button
            class="icon-button"
            type="button"
            (click)="logout()"
            aria-label="Log out"
          >
            <ion-icon name="log-out" />
          </button>
        </div>
      </header>
      <main class="page-content" id="main-content">
        <router-outlet (activate)="content.scrollToTop(0)" />
      </main>
    </div>
    <nav class="mobile-nav" aria-label="Main navigation">
      <a
        routerLink="/app"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        ><ion-icon name="paw" aria-hidden="true" /><span>My pets</span></a
      >
      <a routerLink="/app/pets/new" routerLinkActive="active" ariaCurrentWhenActive="page"
        ><ion-icon name="add" aria-hidden="true" /><span>Add pet</span></a
      >
      <a routerLink="/app/reminders" routerLinkActive="active" ariaCurrentWhenActive="page"
        ><ion-icon name="calendar" aria-hidden="true" /><span>Reminders</span></a
      >
    </nav>
  </div>
</ion-content>
