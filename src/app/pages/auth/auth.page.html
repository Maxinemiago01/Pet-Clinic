<ion-content>
  <div class="auth-page">
    <a routerLink="/login" class="brand"
      ><img src="assets/paw.png" alt="" /><span>petcare<span class="brand-dot">.</span></span></a
    >
    <section class="auth-form-panel">
      <h1>{{ isRegister ? 'Create account' : 'Log in' }}</h1>
      <div class="auth-switch" aria-label="Account access">
        <a
          routerLink="/login"
          [class.selected]="!isRegister"
          [attr.aria-current]="!isRegister ? 'page' : null"
          >Log in</a
        >
        <a
          routerLink="/register"
          [class.selected]="isRegister"
          [attr.aria-current]="isRegister ? 'page' : null"
          >Create account</a
        >
      </div>
      <form #authForm="ngForm" ngNativeValidate (ngSubmit)="submit(authForm)">
        <label class="field"
          >Email address
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            required
            email
            maxlength="254"
            autocomplete="email"
            placeholder="Enter email"
            [disabled]="busy"
          />
        </label>
        <label class="field"
          >Password
          <span class="password-input">
            <input
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="password"
              required
              minlength="8"
              [autocomplete]="isRegister ? 'new-password' : 'current-password'"
              placeholder="Enter password"
              [disabled]="busy"
            />
            <button
              type="button"
              class="icon-button"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <ion-icon [name]="showPassword ? 'eye-off' : 'eye'" aria-hidden="true" />
            </button>
          </span>
        </label>
        @if (isRegister) {
        <label class="field"
          >Confirm password
          <input
            [type]="showPassword ? 'text' : 'password'"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="Enter password"
            [disabled]="busy"
          />
        </label>
        } @if (error) {
        <p class="message error" role="alert">{{ error }}</p>
        }
        <button
          class="button primary auth-submit"
          type="submit"
          [disabled]="busy"
          [attr.aria-busy]="busy"
        >
          {{ isRegister ? 'Create my account' : 'Login' }}
          <ion-icon name="arrow-forward" aria-hidden="true" />
        </button>
      </form>
    </section>
  </div>
</ion-content>
